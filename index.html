<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>軍事口譯詞彙學習系統</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🎯 軍事口譯詞彙學習系統</h1>
            <p class="subtitle">Military Vocabulary Learning Platform</p>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="browse">📚 詞彙瀏覽</button>
            <button class="nav-tab" data-tab="learn">💡 學習模式</button>
            <button class="nav-tab" data-tab="quiz">✍️ 測驗模式</button>
            <button class="nav-tab" data-tab="progress">📊 進度追蹤</button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Browse Tab -->
            <div id="browse-tab" class="tab-content active">
                <div class="controls">
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="搜尋詞彙... (中文或英文)">
                    </div>
                    <div class="filter-group">
                        <label>分類篩選：</label>
                        <select id="category-filter">
                            <option value="all">全部</option>
                            <option value="general">通用術語</option>
                            <option value="army">陸軍</option>
                            <option value="navy">海軍</option>
                            <option value="airforce">空軍</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>難度：</label>
                        <select id="difficulty-filter">
                            <option value="all">全部</option>
                            <option value="1">基礎</option>
                            <option value="2">進階</option>
                        </select>
                    </div>
                    <div class="sort-group">
                        <label>排序：</label>
                        <select id="sort-option">
                            <option value="id">預設</option>
                            <option value="chinese">中文字母</option>
                            <option value="english">英文字母</option>
                        </select>
                    </div>
                </div>
                <div id="vocab-list" class="vocab-list"></div>
                <div id="vocab-stats" class="stats-info"></div>
            </div>

            <!-- Learn Tab -->
            <div id="learn-tab" class="tab-content">
                <div class="learn-controls">
                    <div class="mode-selector">
                        <label>學習方向：</label>
                        <div class="button-group">
                            <button id="mode-ch-en" class="mode-btn active">中文 → 英文</button>
                            <button id="mode-en-ch" class="mode-btn">英文 → 中文</button>
                        </div>
                    </div>
                    <div class="category-selector">
                        <label>選擇範圍：</label>
                        <select id="learn-category">
                            <option value="all">全部詞彙</option>
                            <option value="general">通用術語</option>
                            <option value="army">陸軍</option>
                            <option value="navy">海軍</option>
                            <option value="airforce">空軍</option>
                            <option value="review">待複習</option>
                        </select>
                    </div>
                    <button id="start-learn" class="btn-primary">開始學習</button>
                </div>

                <div id="flashcard-container" class="flashcard-container" style="display: none;">
                    <div class="flashcard-header">
                        <div class="progress-info">
                            <span id="card-counter">1 / 10</span>
                        </div>
                        <button id="exit-learn" class="btn-secondary">結束學習</button>
                    </div>

                    <div class="flashcard" id="flashcard">
                        <div class="flashcard-inner">
                            <div class="flashcard-front">
                                <div class="card-content">
                                    <div class="card-label">問題</div>
                                    <div class="card-term" id="card-question"></div>
                                    <div class="card-hint">點擊卡片或按 Space / Enter 翻轉查看答案</div>
                                </div>
                            </div>
                            <div class="flashcard-back">
                                <div class="card-content">
                                    <div class="card-label">答案</div>
                                    <div class="card-term" id="card-answer"></div>
                                    <div class="card-details">
                                        <div id="card-abbreviation"></div>
                                        <div id="card-example"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="flashcard-actions">
                        <button id="btn-need-review" class="btn-review">需要複習 <span class="shortcut-key">[1]</span></button>
                        <button id="btn-next" class="btn-success">下一張 <span class="shortcut-key">[2]</span></button>
                        <button id="btn-mastered" class="btn-mastered">已掌握 <span class="shortcut-key">[3]</span></button>
                    </div>
                </div>

                <div id="learn-complete" class="complete-screen" style="display: none;">
                    <h2>學習完成！</h2>
                    <div class="complete-stats">
                        <p>本次學習詞彙數：<span id="learn-total"></span></p>
                        <p>標記為已掌握：<span id="learn-mastered"></span></p>
                        <p>需要複習：<span id="learn-review"></span></p>
                    </div>
                    <button id="restart-learn" class="btn-primary">再次學習</button>
                </div>
            </div>

            <!-- Quiz Tab -->
            <div id="quiz-tab" class="tab-content">
                <div class="quiz-setup">
                    <h2>測驗設定</h2>
                    <div class="quiz-config">
                        <div class="config-group">
                            <label>測驗類型：</label>
                            <select id="quiz-type">
                                <option value="multiple">選擇題</option>
                                <option value="fillblank">填空題</option>
                            </select>
                        </div>
                        <div class="config-group">
                            <label>測驗範圍：</label>
                            <select id="quiz-category">
                                <option value="all">全部詞彙</option>
                                <option value="general">通用術語</option>
                                <option value="army">陸軍</option>
                                <option value="navy">海軍</option>
                                <option value="airforce">空軍</option>
                            </select>
                        </div>
                        <div class="config-group">
                            <label>題目數量：</label>
                            <select id="quiz-count">
                                <option value="10">10 題</option>
                                <option value="20">20 題</option>
                                <option value="30">30 題</option>
                            </select>
                        </div>
                        <div class="config-group">
                            <label>測驗方向：</label>
                            <div class="button-group">
                                <button id="quiz-mode-ch-en" class="mode-btn active">中文 → 英文</button>
                                <button id="quiz-mode-en-ch" class="mode-btn">英文 → 中文</button>
                            </div>
                        </div>
                    </div>
                    <button id="start-quiz" class="btn-primary">開始測驗</button>
                </div>

                <div id="quiz-container" class="quiz-container" style="display: none;">
                    <div class="quiz-header">
                        <div class="quiz-progress">
                            <span id="quiz-counter">題目 1 / 10</span>
                            <span id="quiz-score">得分：0</span>
                        </div>
                    </div>

                    <div class="quiz-question">
                        <h3 id="question-text"></h3>
                        <div id="quiz-options" class="quiz-options"></div>
                        <div id="quiz-feedback" class="quiz-feedback"></div>
                    </div>

                    <div class="quiz-actions">
                        <button id="submit-answer" class="btn-primary">提交答案</button>
                        <button id="next-question" class="btn-success" style="display: none;">下一題</button>
                    </div>
                </div>

                <div id="quiz-result" class="quiz-result" style="display: none;">
                    <h2>測驗結果</h2>
                    <div class="result-summary">
                        <div class="score-display">
                            <div class="score-circle">
                                <span id="final-score">0</span>%
                            </div>
                        </div>
                        <div class="result-stats">
                            <p>答對題數：<span id="correct-count">0</span></p>
                            <p>答錯題數：<span id="wrong-count">0</span></p>
                            <p>總題數：<span id="total-questions">0</span></p>
                        </div>
                    </div>
                    <div id="wrong-answers" class="wrong-answers"></div>
                    <div class="result-actions">
                        <button id="retry-quiz" class="btn-primary">重新測驗</button>
                        <button id="review-wrong" class="btn-secondary">加入複習清單</button>
                    </div>
                </div>
            </div>

            <!-- Progress Tab -->
            <div id="progress-tab" class="tab-content">
                <h2>學習進度統計</h2>

                <div class="progress-overview">
                    <div class="stat-card">
                        <div class="stat-label">總詞彙數</div>
                        <div class="stat-value" id="total-vocab">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">已掌握</div>
                        <div class="stat-value" id="mastered-vocab">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">需複習</div>
                        <div class="stat-value" id="review-vocab">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">掌握率</div>
                        <div class="stat-value" id="mastery-rate">0%</div>
                    </div>
                </div>

                <div class="category-progress">
                    <h3>各分類進度</h3>
                    <div id="category-stats" class="category-stats"></div>
                </div>

                <div class="progress-actions">
                    <button id="reset-progress" class="btn-danger">重置進度</button>
                    <button id="export-progress" class="btn-secondary">匯出進度</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2025 軍事口譯詞彙學習系統 | 祝您面試順利！</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
